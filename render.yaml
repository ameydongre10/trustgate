services:
  # 1. TrustGate Instant Static Web Gateway (0s cold start, 100% uptime, instant UI/UX)
  - type: static
    name: trustgate-web
    plan: free
    buildCommand: echo "Static asset build complete"
    staticPublishPath: ./web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 2. TrustGate Interactive Streamlit Operator Dashboard
  # Note: Kept warm 24/7 via .github/workflows/keep_alive.yml
  - type: web
    name: trustgate-ui
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install --upgrade pip && pip install -e .
    startCommand: streamlit run src/trustgate/ui/dashboard.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: TRUSTGATE_ENV
        value: production

  # 3. TrustGate Production FastAPI Backend & REST API
  # Note: Kept warm 24/7 via .github/workflows/keep_alive.yml
  - type: web
    name: trustgate-api
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install --upgrade pip && pip install -e .
    startCommand: uvicorn trustgate.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: TRUSTGATE_ENV
        value: production
