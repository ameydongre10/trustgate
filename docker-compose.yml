services:
  api:
    build: .
    command: uvicorn trustgate.api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - TRUSTGATE_ENV=production
      - TRUSTGATE_LOG_LEVEL=INFO
      - TRUSTGATE_STORAGE_PATH=/app/data
    volumes:
      - trustgate_data:/app/data

  ui:
    build: .
    command: streamlit run src/trustgate/ui/dashboard.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - TRUSTGATE_API_URL=http://api:8000
    depends_on:
      - api

volumes:
  trustgate_data:
