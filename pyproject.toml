[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trustgate"
version = "0.1.0"
description = "Impact-Aware Data Trust and Verification Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "TrustGate Team" }
]
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "polars>=0.20.0",
    "pyarrow==17.0.0",
    "pandas==2.2.3",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "streamlit>=1.32.0",
    "sqlalchemy>=2.0.28",
    "click>=8.1.7",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis==6.98.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "types-pyyaml>=6.0.12",
]

[project.scripts]
trustgate = "trustgate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trustgate"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line length handled by black/formatter
    "B008", # function calls in arg defaults (FastAPI Depends)
]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "polars.*",
    "pyarrow.*",
    "pandas.*",
    "scipy.*",
    "statsmodels.*",
    "sklearn.*",
    "lightgbm.*",
    "streamlit.*",
    "hypothesis.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=trustgate --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
pythonpath = ["src"]
